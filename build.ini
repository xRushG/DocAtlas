
/*
    Use correct Windows paths to avoid PowerShell errors
	
*/
[debug]
enabled=true
outputPath=debug

[environment]
buildFolder="html"
sitesFolder="sites"
cssFolder="css"
libFolder="lib"
assetsFolder="assets"
searchIndexFile="assets\search-index.json"
allowedMedia="md,jpg,jpeg,png"



[styles] /* Currently not Supported*/
/* Do not use a custom stylesheet */
useCustom="false"

/* Path to a custom stylesheet (empty because not used) */
path=""

[page]
/* Set custom pagetitle*/
title=""

[logo]
/* Enable or disable the logo */
enabled="true"

/* Logo file for dark theme — supports PNG, JPG, SVG */
dark="assets/logo-dark.svg"

/* Logo file for light theme — supports PNG, JPG, SVG */
light="assets/logo-light.svg"

/* Logo used for PDF document export (BUILD.Document.ps1) */
document="assets/logo-light.svg"

[navigation]
/* Set depth of the navigation */
depth=2

[tableOfContents]
/* Automatically generate the table of contents */
enabled=true

/* Depth of entries in the table of contents (2 levels) */
depth=2

/* Filename of the generated table of contents */
name="TableOfContent.html"

/* Headline for the Table of Contents */
Headline="Content"

[document]
/* Show logo (true/false) */
Logo=true

/* Show logo on every page — false = first page only */
LogoAllPages=false

/* Path to the logo file — supports PNG, JPG, SVG */
LogoPath=res\assets\logo-light.svg

/* Logo position: Left, Center, Right, None */
LogoPosition=Right

/* Logo size in cm */
LogoWidth=7
LogoHeight=3.2

/* Show page numbers */
PageNumbers=true

/* Page number position: Left, Center, Right */
PageNumberPosition=Center

/* Default output directory (%ScriptRoot% is replaced at runtime) */
OutputDirectory=%ScriptRoot%\documents

/* Header height in cm */
HeaderHeight=1

/* Footer height in cm */
FooterHeight=1

/* Top margin on first page (with logo/header) in cm */
MarginTopFirst=0.2

/* Page margins in cm */
MarginTop=1
MarginBottom=1
MarginLeft=1
MarginRight=1

/* Page orientation: Portrait, Landscape */
Orientation=Portrait