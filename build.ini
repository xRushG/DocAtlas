
/*
    Use correct Windows paths to avoid PowerShell errors
	
*/
[debug]
enabled=true
outputPath=debug

[environment]
htmlSrcFolder="sites"
navigationIndex="assets\navigation.json"
searchIndex="assets\search-index.json"


[styles]
/* Do not use a custom stylesheet */
useCustom="false"

/* Path to a custom stylesheet (empty because not used) */
path="custom\style.css"

[page]
/* Set custom pagetitle*/
title=""

[logo]
/* Enable or disable the logo */
enabled="true"

/* Logo file for dark theme */
dark="assets/logo-dark.png"

/* Logo file for light theme */
light="assets/logo-light.png"

[navigation]
/* Set depth of the navigation */
depth=2

[tableOfContents]
/* Automatically generate the table of contents */
enabled=true

/* Depth of entries in the table of contents (2 levels) */
depth=2

/* Filename of the generated table of contents */
name="TableOfContent.html"

/* Headline for the Table of Contents */
Headline="Content"